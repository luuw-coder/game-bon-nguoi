<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME 4 NGUOI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; }
        body { background: #121212; color: #fff; min-height: 100vh; padding: 0; position: relative; }
        .page-wrap { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: none; background: #1e1e1e; padding: 22px 32px; border-radius: 0; box-shadow: none; flex: 1; display: flex; flex-direction: column; }
        .container.auth-mode { max-width: 460px; margin: 0 auto; align-self: center; justify-content: center; min-height: 100vh; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h1 { text-align: center; color: #ff9800; margin-bottom: 20px; font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
        .screen { display: none; } .screen.active { display: block; }
        
        /* FORM ĐĂNG NHẬP */
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; color: #ccc; font-weight: bold; font-size: 13px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus { border-color: #ff9800; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #4caf50; color: #fff; width: 100%; font-size: 15px; margin-top: 10px; } 
        .btn-green:hover { background: #45a049; }
        .btn-gray { background: #444; color: #fff; } .btn-gray:hover { background: #555; }
        .btn-purple { background: #9c27b0; color: #fff; } .btn-purple:hover { background: #7b1fa2; }

        .username-input-group { display: flex; align-items: stretch; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .username-input-group input { border: none; border-radius: 0; flex: 1; min-width: 0; }
        .username-input-group input:focus { border: none; }
        .username-input-group.focused { border-color: #ff9800; }
        .username-suffix { background: #333; color: #aaa; padding: 10px 10px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; }

        .game-layout { display: flex; gap: 18px; flex: 1; align-items: stretch; min-height: 0; width: 100%; }

        .chat-sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .chat-sidebar-header span { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .chat-collapse-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 2px 6px; }
        .chat-collapse-btn:hover { color: #fff; }
        .chat-sidebar.collapsed { flex: 0 0 44px; max-width: 44px; overflow: hidden; }

        .chat-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 5px; }
        .chat-tab { padding: 5px 10px; background: #2a2a2a; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #444; }
        .chat-tab.active { background: #ff9800; color: #000; font-weight: bold; border-color: #ff9800; }
        .chat-tab .close-btn { color: #f44336; font-weight: bold; cursor: pointer; padding: 0 3px; }
        .chat-tab .close-btn:hover { color: #fff; background: #f44336; border-radius: 50%; }
        .chat-tab .owner-btn { color: #e040fb; font-weight: bold; cursor: pointer; padding: 0 3px; }
        .chat-tab .owner-btn:hover { color: #fff; background: #9c27b0; border-radius: 50%; }

        .chat-box { flex: 1; background: #111; padding: 8px; border-radius: 6px; overflow-y: auto; margin-bottom: 8px; font-size: 13px; min-height: 0; }
        .chat-msg { margin-bottom: 6px; background: #222; padding: 6px 8px; border-radius: 6px; word-break: break-word; }
        .system-msg { color: #ffb74d; font-style: italic; background: rgba(255, 152, 0, 0.08); padding: 5px 6px; border-left: 3px solid #ff9800; }
        .kick-ban-msg { color: #f44336; font-style: italic; background: rgba(244, 67, 54, 0.08); padding: 5px 6px; border-left: 3px solid #f44336; }
        .chat-img { max-width: 180px; border-radius: 6px; display: block; margin-top: 4px; cursor: pointer; }

        .chat-controls { display: flex; gap: 5px; position: relative; }
        .tool-btn { background: #333; color: white; border: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .tool-btn:hover { background: #555; }

        .emoji-picker { display: none; position: absolute; bottom: 44px; left: 0; background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; width: 200px; flex-wrap: wrap; gap: 5px; z-index: 10; }
        .emoji-picker.active { display: flex; }
        .emoji-item { cursor: pointer; font-size: 18px; transition: 0.2s; }
        .emoji-item:hover { transform: scale(1.3); }

        .menu-center { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .user-card { background: #1a1a1a; padding: 12px 14px; border-radius: 6px; border-left: 4px solid #4caf50; }
        .user-card p { font-size: 13px; margin-bottom: 4px; color: #ddd; }
        .user-card span { color: #ff9800; font-weight: bold; }
