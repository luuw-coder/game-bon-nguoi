<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cà Khịa Online</title>
    <style>
        /* CSS GIAO DIỆN MỚI */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 1000px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h1 { text-align: center; color: #ff9800; margin-bottom: 20px; font-size: 24px; }
        .screen { display: none; } .screen.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 15px; }
        button { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #4caf50; color: #fff; width: 100%; } .btn-green:hover { background: #45a049; }
        .btn-gray { background: #444; color: #fff; } .btn-gray:hover { background: #555; }
        
        /* BỐ CỤC GAME & TAB CHAT */
        .game-layout { display: flex; gap: 20px; height: 500px; }
        .chat-sidebar { flex: 1.5; background: #181818; border: 1px solid #333; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; }
        
        .chat-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px; }
        .chat-tab { padding: 8px 15px; background: #2a2a2a; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .chat-tab.active { background: #4caf50; font-weight: bold; }
        .chat-tab .close-btn { color: #ff5722; font-weight: bold; cursor: pointer; padding: 0 5px; }
        .chat-tab .close-btn:hover { color: #fff; background: #ff5722; border-radius: 50%; }
        
        .chat-box { flex: 1; background: #111; padding: 10px; border-radius: 6px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; }
        .chat-msg { margin-bottom: 8px; background: #222; padding: 8px; border-radius: 6px; word-break: break-word; }
        .system-msg { color: #ffb74d; font-style: italic; background: transparent; padding: 4px 0; border-bottom: 1px dashed #333; }
        .chat-img { max-width: 200px; border-radius: 8px; display: block; margin-top: 5px; cursor: pointer; }
        
        /* CÔNG CỤ CHAT */
        .chat-controls { display: flex; gap: 6px; position: relative; }
        .tool-btn { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .tool-btn:hover { background: #555; }
        
        .emoji-picker { display: none; position: absolute; bottom: 50px; left: 0; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; width: 200px; flex-wrap: wrap; gap: 5px; }
        .emoji-picker.active { display: flex; }
        .emoji-item { cursor: pointer; font-size: 20px; transition: 0.2s; }
        .emoji-item:hover { transform: scale(1.2); }

        .menu-main { flex: 1; background: #252525; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .user-card { background: #1a1a1a; padding: 12px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #4caf50; }
        .user-card p { font-size: 14px; margin-bottom: 4px; color: #ddd; }
        .user-card span { color: #ff9800; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>GAME CÀ KHỊA ONLINE</h1>

    <!-- MÀN HÌNH ĐĂNG NHẬP (CÓ KIỂM TRA MẬT KHẨU) -->
    <div id="screen-auth" class="screen active">
        <div class="form-group">
            <label>1. Tài khoản đăng nhập (Không được trùng):</label>
            <input type="text" id="auth-username" placeholder="Nhập tên tài khoản...">
        </div>
        <div class="form-group">
            <label>2. Mật khẩu:</label>
            <input type="password" id="auth-password" placeholder="Nhập mật khẩu...">
            <span style="font-size: 12px; color: #aaa; margin-top: 5px; display: block;">* Nếu tài khoản chưa tồn tại, hệ thống sẽ tự động đăng ký mới.</span>
        </div>
        <div class="form-group">
            <label>3. Tên Xưng Hô (Hiển thị trong game):</label>
            <input type="text" id="auth-nickname" placeholder="Ví dụ: Đại Hiệp, Sát Thủ...">
        </div>
        <button id="btn-submit-auth" class="btn-green">ĐĂNG NHẬP VÀO GAME</button>
    </div>

    <!-- MÀN HÌNH GAME -->
    <div id="screen-game" class="screen">
        <div class="game-layout">
            
            <!-- KHU VỰC TRÒ CHUYỆN -->
            <div class="chat-sidebar">
                
                <!-- THANH TABS KÊNH CHAT -->
                <div class="chat-tabs" id="tab-container">
                    <div class="chat-tab active" data-topic="ca_khia_online_game_2026/global" onclick="switchTab(this)">
                        🌐 Kênh Chung
                    </div>
                    <button class="tool-btn" id="btn-create-room" title="Tạo phòng chat riêng">+</button>
                </div>

                <div class="chat-box" id="chat-box"></div>
                
                <div class="chat-controls">
                    <button class="tool-btn" id="btn-toggle-emoji">😀</button>
                    <button class="tool-btn" id="btn-upload-image" title="Gửi ảnh">📷</button>
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                    
                    <div class="emoji-picker" id="emoji-picker">
                        <!-- Custom Emojis theo yêu cầu -->
                        <span class="emoji-item" onclick="insertEmoji('😀')">😀</span>
                        <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
                        <span class="emoji-item" onclick="insertEmoji('😎')">😎</span>
                        <span class="emoji-item" onclick="insertEmoji('🤡')">🤡</span>
                        <span class="emoji-item" onclick="insertEmoji('💀')">💀</span>
                        <span class="emoji-item" onclick="insertEmoji('🐸')">🐸</span>
                        <span class="emoji-item" onclick="insertEmoji('👀')">👀</span>
                        <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span>
                        <span class="emoji-item" onclick="insertEmoji('💔')">💔</span>
                        <span class="emoji-item" onclick="insertEmoji('💩')">💩</span>
                    </div>

                    <input type="text" id="chat-input" placeholder="Nhập chat hoặc Ctrl+V dán ảnh..." style="flex:1; padding:8px; margin:0;">
                    <button id="btn-send-chat" class="btn-gray">Gửi</button>
                </div>
            </div>

            <!-- MENU -->
            <div class="menu-main">
                <div class="user-card">
                    <p>Xưng hô: <span id="display-nickname">---</span></p>
                    <p>Tài khoản: <span id="display-username">---</span></p>
                    <p>Mạng: <span id="display-status-text" style="color:#ffb74d;">Đang kết nối...</span></p>
                </div>
                <button id="btn-logout" class="btn-gray" style="margin-top: auto;">Đăng Xuất</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="networkLoader.js"></script>

<script>
    const GLOBAL_TOPIC = 'ca_khia_online_game_2026/global';
    let currentUser = null;
    let currentTopic = GLOBAL_TOPIC;
    
    // Kho lưu tin nhắn của từng Tab
    const messagesDB = { [GLOBAL_TOPIC]: [] };

    const ui = {
        authScreen: document.getElementById('screen-auth'), gameScreen: document.getElementById('screen-game'),
        username: document.getElementById('auth-username'), password: document.getElementById('auth-password'), nickname: document.getElementById('auth-nickname'),
        chatBox: document.getElementById('chat-box'), chatInput: document.getElementById('chat-input'),
        tabContainer: document.getElementById('tab-container')
    };

    // --- 1. LOGIC ĐĂNG NHẬP / ĐĂNG KÝ ---
    document.getElementById('btn-submit-auth').addEventListener('click', function() {
        const user = ui.username.value.trim();
        const pass = ui.password.value.trim();
        const nick = ui.nickname.value.trim();

        if (!user || !pass || !nick) return alert("Vui lòng điền đủ thông tin!");

        // Lấy cơ sở dữ liệu giả lập từ LocalStorage
        let localUsers = JSON.parse(localStorage.getItem('game_users_db')) || {};

        if (localUsers[user]) {
            // Tài khoản đã tồn tại -> Kiểm tra mật khẩu
            if (localUsers[user].password !== pass) {
                return alert("Tài khoản đã có người sử dụng hoặc bạn nhập SAI MẬT KHẨU!");
            }
            // Đúng pass -> Cập nhật lại nickname mới nếu họ đổi
            localUsers[user].nickname = nick; 
        } else {
            // Tài khoản chưa tồn tại -> Đăng ký mới
            localUsers[user] = { password: pass, nickname: nick };
        }

        // Lưu lại DB
        localStorage.setItem('game_users_db', JSON.stringify(localUsers));
        currentUser = { username: user, nickname: nick };
        
        document.getElementById('display-username').innerText = user;
        document.getElementById('display-nickname').innerText = nick;

        ui.authScreen.classList.remove('active');
        ui.gameScreen.classList.add('active');

        // Bật mạng
        window.NetworkManager.connect(
            currentUser,
            receiveMessage,
            (isOnline) => { document.getElementById('display-status-text').innerText = isOnline ? '🟢 Trực Tuyến' : '🔴 Mất Kết Nối'; }
        );
    });

    document.getElementById('btn-logout').addEventListener('click', function() {
        window.NetworkManager.disconnect();
        location.reload(); // Tải lại trang cho sạch dữ liệu phiên
    });

    // --- 2. HỆ THỐNG TABS PHÒNG CHAT ---
    document.getElementById('btn-create-room').addEventListener('click', function() {
        let roomName = prompt("Nhập mã phòng bạn muốn tạo hoặc tham gia (Ví dụ: 999):");
        if (!roomName) return;
        
        let topicName = 'ca_khia_online_game_2026/room_' + roomName;
        
        // Nếu chưa có tab này thì tạo
        if (!messagesDB[topicName]) {
            messagesDB[topicName] = [];
            window.NetworkManager.joinRoom(topicName, currentUser.nickname);
            
            const newTab = document.createElement('div');
            newTab.className = 'chat-tab';
            newTab.setAttribute('data-topic', topicName);
            newTab.innerHTML = `🔒 Phòng ${roomName} <span class="close-btn" onclick="closeTab(event, '${topicName}', this)">✖</span>`;
            newTab.onclick = function() { switchTab(this); };
            
            ui.tabContainer.insertBefore(newTab, document.getElementById('btn-create-room'));
            switchTab(newTab);
        }
    });

    window.switchTab = function(tabElement) {
        document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
        tabElement.classList.add('active');
        currentTopic = tabElement.getAttribute('data-topic');
        renderChatBox(); // Vẽ lại khung chat theo tin nhắn phòng đó
    }

    window.closeTab = function(event, topic, btnElement) {
        event.stopPropagation(); // Tránh bấm nhầm sang switchTab
        window.NetworkManager.leaveRoom(topic, currentUser.nickname);
        delete messagesDB[topic]; // Xóa dữ liệu phòng
        btnElement.parentElement.remove();
        switchTab(document.querySelector('.chat-tab')); // Quay về kênh chung
    }

    // --- 3. XỬ LÝ NHẬN & GỬI TIN NHẮN CHAT ---
    function receiveMessage(data) {
        if (!messagesDB[data.topic]) messagesDB[data.topic] = [];
        messagesDB[data.topic].push(data);
        
        // Nếu đang mở đúng tab đó thì hiển thị luôn
        if (data.topic === currentTopic) renderChatBox();
    }

    function renderChatBox() {
        ui.chatBox.innerHTML = '';
        const msgs = messagesDB[currentTopic] || [];
        msgs.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'chat-msg' + (msg.isSystem ? ' system-msg' : '');
            
            if (msg.isSystem) {
                div.innerText = msg.text;
            } else {
                let namePrefix = `<strong>${msg.sender}:</strong> `;
                if (msg.type === 'image') {
                    div.innerHTML = `${namePrefix} <br><img src="${msg.text}" class="chat-img" onclick="window.open(this.src)">`;
                } else {
                    div.innerHTML = `${namePrefix} ${msg.text}`;
                }
            }
            ui.chatBox.appendChild(div);
        });
        ui.chatBox.scrollTop = ui.chatBox.scrollHeight;
    }

    document.getElementById('btn-send-chat').addEventListener('click', sendText);
    ui.chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendText(); });

    function sendText() {
        let text = ui.chatInput.value.trim();
        if (text) {
            window.NetworkManager.sendChat(currentTopic, currentUser.nickname, text, 'text');
            ui.chatInput.value = '';
            document.getElementById('emoji-picker').classList.remove('active');
        }
    }

    // --- 4. EMOJI VÀ HÌNH ẢNH (PASTE / UPLOAD) ---
    document.getElementById('btn-toggle-emoji').addEventListener('click', () => {
        document.getElementById('emoji-picker').classList.toggle('active');
    });

    window.insertEmoji = function(emoji) {
        ui.chatInput.value += emoji;
        ui.chatInput.focus();
    };

    // Bấm nút ảnh -> Mở chọn file
    document.getElementById('btn-upload-image').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', function(e) {
        if (e.target.files.length > 0) processAndSendImage(e.target.files[0]);
    });

    // Bắt sự kiện Ctrl+V (Dán ảnh trực tiếp vào ô chat)
    ui.chatInput.addEventListener('paste', function(e) {
        let items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
                let file = items[i].getAsFile();
                processAndSendImage(file);
                e.preventDefault();
            }
        }
    });

    // Chuyển ảnh thành Base64 (Nén kích thước để gửi qua mạng nhanh)
    function processAndSendImage(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; // Nén ảnh xuống nhỏ hơn 400px để ko bị đứt mạng
                let width = img.width;
                let height = img.height;
                
                if (width > MAX_WIDTH) {
                    height = height * (MAX_WIDTH / width);
                    width = MAX_WIDTH;
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Nén thành chuỗi Base64
                const base64Data = canvas.toDataURL('image/jpeg', 0.6); 
                window.NetworkManager.sendChat(currentTopic, currentUser.nickname, base64Data, 'image');
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
