<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Cà Khịa Online</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    body { 
      background: #121212; 
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 15px;
    }
    .container { 
      width: 100%; 
      max-width: 850px; 
      background: #1e1e1e; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
      position: relative;
    }
    h1 { 
      text-align: center; 
      color: #ff9800; 
      margin-bottom: 25px; 
      font-size: 28px; 
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Màn hình (Screen Router) */
    .screen { 
      display: none; 
    }
    .screen.active { 
      display: block; 
    }

    /* Form Đăng nhập */
    .form-group { 
      margin-bottom: 15px; 
    }
    label { 
      display: block; 
      margin-bottom: 5px; 
      color: #ccc; 
      font-size: 14px;
    }
    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 12px; 
      border-radius: 6px; 
      border: 1px solid #444; 
      background: #2a2a2a; 
      color: #fff; 
      font-size: 16px; 
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #ff9800;
    }

    /* Các loại Nút bấm */
    button { 
      width: 100%; 
      padding: 14px; 
      margin-bottom: 12px; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }
    .btn-orange { 
      background: #ff9800; 
      color: #000; 
    }
    .btn-orange:hover { 
      background: #e68a00; 
    }
    .btn-gray { 
      background: #333; 
      color: #fff; 
      border: 1px dashed #555;
    }
    .btn-gray:hover { 
      background: #444; 
    }
    .btn-green { 
      background: #4caf50; 
      color: #fff; 
    }
    .btn-green:hover { 
      background: #45a049; 
    }

    /* Layout Màn hình Game Chính (Grid 2 Cột) */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 650px) {
      .game-layout { grid-template-columns: 1fr; }
    }

    /* Khung Chat Bên Trái */
    .chat-panel {
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      font-weight: bold;
      color: #ff9800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #4caf50;
      border-radius: 50%;
      display: inline-block;
    }
    .chat-box { 
      background: #111; 
      padding: 12px; 
      border-radius: 6px; 
      height: 260px; 
      overflow-y: auto; 
      margin-bottom: 12px; 
      font-size: 14px; 
      border: 1px solid #222; 
      flex-grow: 1;
    }
    .chat-msg { 
      margin-bottom: 8px; 
      background: #222; 
      padding: 8px 12px; 
      border-radius: 6px; 
      word-wrap: break-word; 
    }
    .chat-input-group {
      display: flex;
      gap: 8px;
    }
    .chat-input-group input {
      flex-grow: 1;
      margin-bottom: 0;
    }
    .chat-input-group button {
      width: auto;
      padding: 0 18px;
      margin-bottom: 0;
    }

    /* Khung Thông Tin & Menu Bên Phải */
    .menu-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .user-info-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      font-size: 15px;
      border-left: 4px solid #4caf50;
    }
    .user-info-card div {
      margin-bottom: 6px;
    }
    .user-info-card div:last-child {
      margin-bottom: 0;
    }
    .menu-title {
      font-weight: bold;
      font-size: 18px;
      margin-top: 5px;
      color: #fff;
    }

    /* FIX LỖI 2: KHU VỰC NÚT ADMIN SIÊU TO VÀ DỄ NHẤN */
    .admin-zone {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #333;
      text-align: center;
    }
    .btn-admin-large {
      display: block;
      width: 100%;
      min-height: 52px; /* Vùng bấm cao hơn */
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #ff9800;
      background: #282015;
      border: 2px solid #ff9800;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.15);
      transition: all 0.2s ease;
    }
    .btn-admin-large:hover {
      background: #ff9800;
      color: #000;
      box-shadow: 0 4px 18px rgba(255, 152, 0, 0.4);
    }
    /* Vùng cảm ứng ẩn rộng thêm 10px xung quanh để chạm trên điện thoại không bao giờ hụt */
    .btn-admin-large::before {
      content: '';
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: -10px;
      right: -10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>GAME CÀ KHỊA ONLINE</h1>

    <div id="screen-login" class="screen active">
      <form id="form-login" onsubmit="return false;">
        <div class="form-group">
          <label for="input-nickname">Xưng hô (Biệt danh trong game):</label>
          <input type="text" id="input-nickname" placeholder="Ví dụ: hi" required>
        </div>
        <div class="form-group">
          <label for="input-username">Tài khoản:</label>
          <input type="text" id="input-username" placeholder="Ví dụ: hii" required>
        </div>
        <div class="form-group">
          <label for="input-password">Mật khẩu:</label>
          <input type="password" id="input-password" placeholder="Nhập mật khẩu..." required>
        </div>
        <button type="button" id="btn-submit-login" class="btn-orange">ĐĂNG NHẬP VÀO GAME</button>
      </form>
    </div>

    <div id="screen-main" class="screen">
      <div class="game-layout">
        
        <div class="chat-panel">
          <div class="chat-header">
            <span>💬 Kênh Trò Chuyện</span>
            <span class="status-dot"></span>
          </div>
          <div id="chat-box" class="chat-box">
            </div>
          <div class="chat-input-group">
            <input type="text" id="input-chat-msg" placeholder="Nhập nội dung trò chuyện...">
            <button id="btn-send-chat" class="btn-gray">Gửi</button>
          </div>
        </div>

        <div class="menu-panel">
          <div class="user-info-card">
            <div>Xưng hô: <strong id="display-nickname" style="color:#ff9800;">-</strong></div>
            <div>Tài khoản: <strong id="display-username" style="color:#ff9800;">-</strong></div>
            <div>Kết nối: <span style="color:#4caf50; font-weight:bold;">Trực tuyến (Online)</span></div>
          </div>

          <div class="menu-title">MENU CHÍNH</div>
          <button id="btn-create-room" class="btn-gray">🎮 Tạo Phòng Chơi Mới (Làm sau)</button>
          <button id="btn-join-room" class="btn-gray">🔑 Nhập Key Vào Phòng (Làm sau)</button>
          <button id="btn-leaderboard" class="btn-gray">🏆 Bảng Xếp Hạng (Làm sau)</button>
          <button id="btn-settings" class="btn-gray">⚙️ Cài Đặt Game (Làm sau)</button>
          <button id="btn-logout" class="btn-gray" style="background: #3a2222; border-color: #663333;">🚪 Đăng Xuất Tài Khoản</button>
        </div>

      </div>
    </div>

    <div id="screen-admin" class="screen">
      <h2 style="color: #ff9800; margin-bottom: 15px; text-align: center;">⚙️ BẢNG QUẢN TRỊ ADMIN</h2>
      <div style="background: #181818; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;">
        <p style="margin-bottom: 10px;">Chào mừng Admin! Tại đây bạn có thể quản lý hệ thống, phòng chơi và người dùng.</p>
        <ul style="padding-left: 20px; line-height: 1.8; color: #ccc;">
          <li>Danh sách tài khoản đang Online: <strong style="color: #4caf50;">1 người</strong></li>
          <li>Trạng thái Server: <strong style="color: #4caf50;">Hoạt động bình thường</strong></li>
        </ul>
      </div>
      <button id="btn-back-from-admin" class="btn-orange">⬅ Quay Lại Game</button>
    </div>

    <div class="admin-zone">
      <button id="btn-open-admin" class="btn-admin-large">
        🛡️ BẤM VÀO ĐÂY ĐỂ MỞ BẢNG ADMIN
      </button>
    </div>

  </div>

  <script src="networkLoader.js"></script>
  <script src="mainRouter.js"></script>
  <script src="uiLoader.js"></script>
</body>
</html>
